<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Senior UX Designer & New Media Artist</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        'md': '768px',
                        'lg': '1024px',
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    
    <style>
        :root {
            --ink-black: #0E0E0E;
            --rice-paper: #FAF8F5;
            --fog-grey: #D9D6D2;
            --shu-red: #E34234;
            --aizome-blue: #26406F;
            --deep-cedar: #1E3A2E;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--rice-paper);
            color: var(--ink-black);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 300;
        }
        
        h1 {
            font-weight: 200 !important;
        }
        
        .font-serif {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-style: italic;
        }
        
        /* Typography Scale - Following brand guidelines */
        .text-h1 { 
            font-size: 72px; 
            font-weight: 300; 
            line-height: 1.1; 
            letter-spacing: -0.02em;
        }
        .text-h2 { 
            font-size: 48px; 
            font-weight: 300; 
            line-height: 1.2; 
            letter-spacing: -0.01em;
        }
        .text-h3 { 
            font-size: 32px; 
            font-weight: 400; 
            line-height: 1.3; 
            letter-spacing: -0.01em;
        }
        .text-body-l { 
            font-size: 20px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        .text-body-m { 
            font-size: 18px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        .text-body-s { 
            font-size: 16px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        
        /* Responsive typography scale - using Tailwind breakpoints */
        @media (max-width: 768px) {
            .text-h1 { font-size: 48px; }
            .text-h2 { font-size: 36px; }
            .text-h3 { font-size: 28px; }
            .text-body-l { font-size: 18px; }
        }
        
        /* Color System */
        .text-ink-black { color: var(--ink-black); }
        .bg-ink-black { background-color: var(--ink-black); }
        .text-rice-paper { color: var(--rice-paper); }
        .bg-rice-paper { background-color: var(--rice-paper); }
        .text-fog-grey { color: var(--fog-grey); }
        .bg-fog-grey { background-color: var(--fog-grey); }
        .text-shu-red { color: var(--shu-red); }
        .bg-shu-red { background-color: var(--shu-red); }
        
        /* Container with wide margins - more editorial - mobile first */
        .container-wide {
            max-width: 2200px;
            margin: 0 auto;
            padding: 0 1rem; /* Mobile: 16px */
        }
        
        @media (min-width: 768px) {
            .container-wide {
                padding: 0 2rem; /* Tablet: 32px */
            }
        }
        
        @media (min-width: 1024px) {
            .container-wide {
                padding: 0 60px;
            }
        }
        
        @media (min-width: 1440px) {
            .container-wide {
                padding: 0 70px;
            }
        }
        
        @media (min-width: 1920px) {
            .container-wide {
                padding: 0 80px;
            }
        }
        
        /* Navigation */
        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--ink-black);
            letter-spacing: 0.03em;
            font-size: 14px;
            font-weight: 300;
            transition: opacity 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }
        
        .nav-link:hover {
            opacity: 0.6;
            transform: translateX(-2px);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--ink-black);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .nav-link.active {
            opacity: 1;
            color: var(--aizome-blue);
            font-weight: 500;
            transition: opacity 0.3s ease, color 0.3s ease;
        }
        
        .nav-link.active::after {
            display: none;
        }
        
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 4px;
            height: 4px;
            background-color: var(--aizome-blue);
            border: 1px solid var(--aizome-blue);
            border-radius: 50%;
            box-shadow: 0 0 0 0.5px var(--aizome-blue);
            animation: activeDotIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes activeDotIn {
            to {
                transform: translateY(-50%) scale(1);
            }
        }
        
        /* Image Placeholder */
        .image-placeholder {
            background-color: var(--fog-grey);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-black);
            opacity: 0.2;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
        }
        
        /* Tag/Label */
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--aizome-blue);
        }
        
        /* Work Project Title - Ensure line-height is applied */
        .work-project-title {
            line-height: 1.0 !important;
        }
        
        /* Hover Effects - Tactile */
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-3px);
            opacity: 0.95;
        }
        
        /* Smooth Page Section Transitions */
        section {
            transition: opacity 0.3s ease-out;
        }
        
        /* Enhanced Image Transitions */
        .work-project-image img,
        .work-project-image .image-placeholder {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Work Project Clickable Styles */
        .work-project a {
            text-decoration: none;
            color: inherit;
        }
        
        .work-project {
            transition: background-color 0.3s ease;
        }
        
        .work-project-container {
            padding: 16px 0 0 0;
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }
        
        .work-project-content {
            padding: 0 36px;
        }
        
        .work-project:hover .work-project-container {
            background-color: rgba(0, 0, 0, 0.015);
            border-radius: 12px;
        }
        
        .work-project:hover .work-project-image img,
        .work-project:hover .work-project-image .image-placeholder {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }
        
        .work-project-lock-overlay {
            pointer-events: none;
        }
        
        .work-project:hover .work-project-lock-overlay {
            opacity: 1;
        }
        
        /* Page Load Animation */
        body {
            opacity: 0;
            animation: pageFadeIn 0.6s ease-out forwards;
        }
        
        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Page Transitions */
        .page-transition {
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Staggered Fade In */
        .fade-in {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        .fade-in-delay-1 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }
        
        .fade-in-delay-2 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }
        
        .fade-in-delay-3 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        
        .fade-in-delay-4 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Slide In from Right */
        .slide-in-right {
            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.8s ease-out forwards;
        }
        
        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Slide In from Left */
        .slide-in-left {
            opacity: 0;
            transform: translateX(-30px);
            animation: slideInLeft 0.8s ease-out forwards;
        }
        
        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Scale In */
        .scale-in {
            opacity: 0;
            transform: scale(0.95);
            animation: scaleIn 0.6s ease-out forwards;
        }
        
        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Scroll Reveal - Initially Hidden */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Navigation Animation */
        .nav-animate {
            opacity: 0;
            animation: fadeInRight 1s ease-out 0.3s forwards;
        }
        
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Hero Title Animation */
        .hero-title {
            opacity: 0;
            animation: heroTitleIn 1.2s ease-out 0.2s forwards;
        }
        
        @keyframes heroTitleIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Hero Subtitle Animation */
        .hero-subtitle {
            opacity: 0;
            animation: heroSubtitleIn 1s ease-out 0.6s forwards;
        }
        
        @keyframes heroSubtitleIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.7;
            }
        }
        
        /* Work Project Stagger */
        .work-item {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .work-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Art Grid Item Animation */
        .art-item {
            opacity: 0;
            transform: scale(0.98) translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .art-item.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        
        /* Smooth Image Load */
        img {
            opacity: 0;
            transition: opacity 0.6s ease-out;
            background-color: var(--fog-grey);
        }
        
        img.loaded {
            opacity: 1;
            background-color: transparent;
        }
        
        /* Subtle Loading Pulse */
        @keyframes subtlePulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        img:not(.loaded) {
            animation: subtlePulse 1.5s ease-in-out infinite;
        }
        
        /* Prevent Flash of Unstyled Content */
        .preload {
            visibility: hidden;
        }
        
        .preload.loaded {
            visibility: visible;
        }
        
        /* Button Hover Enhancement */
        .btn-primary {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        
        /* Tag Animation */
        .tag-animate {
            opacity: 0;
            animation: tagFadeIn 0.8s ease-out forwards;
        }
        
        @keyframes tagFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 0.4;
                transform: translateY(0);
            }
        }
        
        /* Back Button Animation */
        button {
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        
        button:hover {
            transform: translateX(-3px);
        }
        
        /* Smooth Scroll Behavior Enhancement */
        html {
            scroll-behavior: smooth;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Divider */
        .divider {
            height: 1px;
            background-color: var(--fog-grey);
        }
        
        /* Button */
        .btn-primary {
            background-color: var(--ink-black);
            color: var(--rice-paper);
            padding: 14px 28px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: opacity 0.2s ease;
            min-height: 44px;
            letter-spacing: 0.02em;
        }
        
        .btn-primary:hover {
            opacity: 0.85;
        }
        
        /* Form Inputs */
        .form-input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--fog-grey);
            background: transparent;
            font-size: 18px;
            font-weight: 300;
            color: var(--ink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: border-color 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-bottom-color: var(--ink-black);
        }
        
        .form-input::placeholder {
            color: var(--ink-black);
            opacity: 0.3;
        }
        
        /* Editorial Grid - 12 columns */
        .editorial-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 32px;
        }
        
        @media (max-width: 768px) {
            .editorial-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Navigation Component - Vertical, editorial style
        const Navigation = ({ currentPage, onNavigate }) => {
            const navItems = [
                { id: 'home', label: 'Home' },
                { id: 'work', label: 'Work' },
                { id: 'art', label: 'Art' }
            ];

            return (
                <nav className="fixed right-0 top-0 bottom-0 z-50 w-[120px] py-16 mr-4 md:mr-0 nav-animate">
                    <div className="flex flex-col h-full justify-between">
                        <div className={`flex flex-col items-end md:items-center ${currentPage !== 'home' ? 'hidden md:flex' : ''}`}>
                            <div className="[writing-mode:vertical-rl] [text-orientation:mixed] rotate-180 fade-in-delay-1">
                                <div className="text-ink-black text-body-s font-light tracking-[0.2em] opacity-40">
                                    Portfolio
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-col gap-8 items-end md:items-center">
                            {navItems.map((item, index) => (
                                <div key={item.id} className={`relative fade-in-delay-${Math.min(index + 2, 4)}`}>
                                    <a
                                        href={`#${item.id}`}
                                        onClick={(e) => {
                                            e.preventDefault();
                                            onNavigate(item.id);
                                        }}
                                        className={`nav-link text-xs relative ${currentPage === item.id ? 'active' : ''}`}
                                    >
                                        {item.label}
                                    </a>
                                </div>
                            ))}
                            <div className={`relative mt-4 fade-in-delay-4`}>
                                <a
                                    href="mailto:contact@example.com"
                                    className="nav-link text-xs relative"
                                >
                                    Contact
                                </a>
                            </div>
                        </div>
                        <div className={`flex flex-col items-end md:items-center gap-0 ${currentPage !== 'home' ? 'hidden md:flex' : ''}`}>
                            <div className="flex flex-col items-end md:items-center gap-1 mb-2 fade-in-delay-3">
                                {[...Array(8)].map((_, i) => {
                                    const reversedIndex = 7 - i;
                                    const opacity = Math.max(0.2, 1 - (reversedIndex * 0.12));
                                    const isDot = reversedIndex >= 4;
                                    return (
                                        <div
                                            key={i}
                                            className="w-px bg-[var(--fog-grey)]"
                                            style={{
                                                height: isDot ? '2px' : '8px',
                                                opacity: opacity,
                                                borderRadius: isDot ? '50%' : '0'
                                            }}
                                        />
                                    );
                                })}
                            </div>
                            <div className="w-px h-16 bg-[var(--fog-grey)] ml-auto md:mx-auto"></div>
                        </div>
                    </div>
                </nav>
            );
        };

        // Home/Landing Page - More editorial, less centered
        const Home = () => {
            const titleRef = React.useRef(null);
            const [subtitleWidth, setSubtitleWidth] = React.useState(null);
            const [letterSpacing, setLetterSpacing] = React.useState(0.65);

            React.useEffect(() => {
                if (titleRef.current) {
                    const titleWidth = titleRef.current.offsetWidth;
                    setSubtitleWidth(titleWidth);
                    
                    // Calculate letter spacing to match width
                    const subtitle = 'INTERACTION DESIGNER & NEW MEDIA ARTIST';
                    const baseWidth = subtitle.length * 8.4; // approximate character width at 14px
                    const spacingNeeded = (titleWidth - baseWidth) / (subtitle.length - 1);
                    const calculatedSpacing = Math.max(0, spacingNeeded / 14); // convert to em
                    setLetterSpacing(calculatedSpacing);
                }
            }, []);

            return (
                <section id="home" className="min-h-screen page-transition hero-section py-20 px-6 md:py-32 md:px-12 md:mx-4 md:ml-8 lg:px-16 flex flex-col justify-center items-center md:items-start">
                    <div className="container-wide pl-0 w-full">
                        <div className="max-w-full md:max-w-[600px] lg:max-w-[1200px] mx-auto text-center md:text-left">
                            <div className="mb-12 md:mb-20">
                                <h1 ref={titleRef} className="hero-title font-light text-4xl md:text-7xl lg:text-[100px] xl:text-[128px] leading-[1.05] tracking-[0.02em] mb-2 font-[200] inline-block text-[#4A4A4A] whitespace-nowrap">
                                    Hodo's Design
                                </h1>
                                <h1 className="hero-title font-light text-4xl md:text-7xl lg:text-[100px] xl:text-[128px] leading-[1.05] tracking-[0.02em] mb-4 md:mb-6 font-[200] text-[#4A4A4A]" style={{ animationDelay: '0.3s' }}>
                                    Portfolio
                                </h1>
                                <p className="hero-subtitle font-light text-xs md:text-sm tracking-[0.2em] uppercase inline-block text-[#4A4A4A] font-[300]" style={{ letterSpacing: `${letterSpacing}em`, width: subtitleWidth ? `${subtitleWidth}px` : 'auto' }}>
                                    interaction designer & new media artist
                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Intersection Observer Hook for Scroll Animations
        const useIntersectionObserver = (ref, options = {}) => {
            const [isIntersecting, setIsIntersecting] = useState(false);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsIntersecting(true);
                    }
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px',
                    ...options
                });
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => {
                    if (ref.current) {
                        observer.unobserve(ref.current);
                    }
                };
            }, [ref]);
            
            return isIntersecting;
        };

        // Project Detail Component
        const ProjectDetail = ({ project, onBack }) => {
            const containerRef = React.useRef(null);
            const isVisible = useIntersectionObserver(containerRef, { threshold: 0 });
            
            // Scroll to top when component mounts
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }, []);

            return (
                <section id="work" className="page-transition py-20 px-6 md:py-32 md:px-12 md:mx-4 md:ml-8 lg:px-16 xl:px-16 min-h-screen">
                    <div ref={containerRef} className="container-wide pl-0 w-full">
                        <div className="max-w-full md:max-w-[600px] lg:max-w-[1200px] mx-auto">
                            <button 
                                onClick={onBack}
                                className={`mb-8 text-sm text-[#4A4A4A] opacity-60 hover:opacity-100 transition-opacity font-[300] fade-in ${isVisible ? 'fade-in' : ''}`}
                            >
                                ← Back to Portfolio
                            </button>
                            <div className={`mb-12 md:mb-20 fade-in-delay-1 ${isVisible ? 'fade-in-delay-1' : ''}`}>
                                <span className="tag tag-animate text-[10px] md:text-[11px] lg:text-[12px] tracking-[0.2em] font-bold opacity-40">{project.category}</span>
                            </div>
                            <div className={`mb-8 fade-in-delay-2 ${isVisible ? 'fade-in-delay-2' : ''}`}>
                                <h1 className="font-light text-3xl md:text-5xl lg:text-[64px] leading-[1.2] tracking-[0.01em] mb-4 md:mb-6 font-[200] text-[#4A4A4A]">
                                    {project.title}
                                </h1>
                                <div className="text-sm md:text-base text-[#4A4A4A] opacity-50 font-[300] mb-8">
                                    {project.year}
                                </div>
                            </div>
                            {project.image && (
                                <div className={`mb-12 md:mb-16 scale-in ${isVisible ? 'scale-in' : ''}`} style={{ animationDelay: '0.3s' }}>
                                    <img 
                                        src={project.image} 
                                        alt={project.title} 
                                        className="w-full h-auto rounded-xl"
                                        onLoad={(e) => e.target.classList.add('loaded')}
                                    />
                                </div>
                            )}
                            <div className={`prose max-w-none fade-in-delay-4 ${isVisible ? 'fade-in-delay-4' : ''}`}>
                                <p className="font-light mb-8 leading-[1.7] text-base md:text-lg lg:text-xl text-[#4A4A4A] opacity-70 font-[300]">
                                    {project.quote}
                                </p>
                                {/* Add more project detail content here */}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Work Item Component with Scroll Animation
        const WorkItem = ({ project, index, onProjectSelect }) => {
            const itemRef = React.useRef(null);
            const isVisible = useIntersectionObserver(itemRef, { threshold: 0.15 });
            
            return (
                <article 
                    ref={itemRef}
                    className={`hover-lift work-project work-item relative cursor-pointer group ${isVisible ? 'visible' : ''}`} 
                    data-project-id={project.id}
                    style={{ transitionDelay: `${index * 0.1}s` }}
                >
                    <div 
                        onClick={() => onProjectSelect(project.id)}
                        className="block cursor-pointer"
                    >
                        <div className="work-project-container flex flex-col xl:flex-row gap-6 md:gap-8 xl:gap-[60px] items-stretch">
                            {/* On mobile/tablet, always show image first. On xl, alternate based on index */}
                            <div className={`work-project-image w-full xl:w-[70%] flex items-stretch relative ${index % 2 === 0 ? 'xl:order-1' : 'xl:order-2'}`}>
                                {project.image ? (
                                    <>
                                        <img 
                                            src={project.image} 
                                            alt={project.title} 
                                            className="w-full h-auto min-h-[250px] md:min-h-[300px] xl:h-full xl:min-h-[500px] object-cover rounded-xl"
                                            onLoad={(e) => e.target.classList.add('loaded')}
                                        />
                                        {(project.id === 2 || project.id === 3) && (
                                            <div className="work-project-lock-overlay absolute inset-0 flex items-center justify-center bg-black bg-opacity-20 rounded-xl opacity-0 transition-opacity duration-300">
                                                <img src="assets/lock.fill.svg" alt="Locked" className="w-20 h-20 md:w-24 md:h-24 lg:w-32 lg:h-32 opacity-60" />
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <div className="image-placeholder w-full h-auto min-h-[250px] md:min-h-[300px] xl:h-full xl:min-h-[500px] rounded-xl">
                                        Project Image
                                    </div>
                                )}
                            </div>
                            <div className={`work-project-content w-full xl:w-[30%] flex flex-col text-center md:text-left ${index % 2 === 0 ? 'xl:order-2' : 'xl:order-1'}`}>
                                <div className="mb-4 md:mb-8">
                                    <span className="tag text-[10px] md:text-[11px] lg:text-[12px] tracking-[0.2em]">{project.category}</span>
                                </div>
                                <h2 className="font-light work-project-title text-2xl md:text-4xl lg:text-[56px] leading-[1.7] tracking-[0.01em] mb-4 md:mb-6 lg:mb-10 font-[200] text-[#4A4A4A]">
                                    {project.title}
                                </h2>
                                <p className="font-light mb-6 md:mb-8 lg:mb-12 leading-[1.7] text-sm md:text-base lg:text-xl text-[#4A4A4A] opacity-70 font-[300]">
                                    {project.quote}
                                </p>
                                <div className="text-xs md:text-sm lg:text-base text-[#4A4A4A] opacity-50 font-[300]">
                                    {project.year}
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            );
        };

        // Work Section - Clean editorial layout
        const Work = ({ selectedProject, onProjectSelect, projects }) => {
            const sectionRef = React.useRef(null);
            const isVisible = useIntersectionObserver(sectionRef, { threshold: 0.1 });

            return (
                <section id="work" ref={sectionRef} className="page-transition py-20 px-6 md:py-32 md:px-12 md:mx-4 md:ml-8 lg:px-16 xl:px-16">
                    <div className="container-wide pl-0 w-full">
                        <div className="max-w-full md:max-w-[600px] lg:max-w-[1200px] mx-auto">
                            <div className={`mb-12 md:mb-20 text-center md:text-left scroll-reveal ${isVisible ? 'revealed' : ''}`}>
                                <span className="tag tag-animate text-[10px] md:text-[11px] lg:text-[12px] tracking-[0.2em] font-bold opacity-40">UX & Interaction Design</span>
                            </div>

                            <div className="flex flex-col gap-16 md:gap-24 lg:gap-48 xl:gap-64">
                                {projects.map((project, index) => (
                                    <WorkItem 
                                        key={project.id}
                                        project={project}
                                        index={index}
                                        onProjectSelect={onProjectSelect}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Art Item Component with Scroll Animation
        const ArtItem = ({ artwork, index }) => {
            const itemRef = React.useRef(null);
            const isVisible = useIntersectionObserver(itemRef, { threshold: 0.2 });
            
            return (
                <div 
                    ref={itemRef}
                    className={`hover-lift art-item text-center md:text-left ${isVisible ? 'visible' : ''}`}
                    style={{ transitionDelay: `${index * 0.08}s` }}
                >
                    <div 
                        className="image-placeholder aspect-[3/4] mb-4 md:mb-6 w-full max-h-[400px] md:max-h-[500px] lg:max-h-[600px]"
                    >
                        Artwork Image
                    </div>
                    <h3 className="font-light mb-2 md:mb-3 lg:mb-4 text-xl md:text-2xl lg:text-[36px] leading-[1.2] tracking-[0.01em] font-[200] text-[#4A4A4A]">
                        {artwork.title}
                    </h3>
                    <p className="text-xs md:text-sm lg:text-base text-[#4A4A4A] opacity-60 mb-1 md:mb-1.5 lg:mb-2 font-[300]">
                        {artwork.venue}
                    </p>
                    <p className="text-xs md:text-sm lg:text-base text-[#4A4A4A] opacity-50 font-[300]">
                        {artwork.year}
                    </p>
                </div>
            );
        };

        // Art Section - Editorial grid layout
        const Art = () => {
            const artworks = [
                { 
                    id: 1, 
                    title: 'Ma: Digital Spaces', 
                    venue: 'Contemporary Art Gallery, Tokyo', 
                    year: '2024'
                },
                { 
                    id: 2, 
                    title: 'Wabi-Sabi Algorithms', 
                    venue: 'New Media Art Center, Berlin', 
                    year: '2023'
                },
                { 
                    id: 3, 
                    title: 'Tactile Interfaces', 
                    venue: 'Art & Technology Biennial', 
                    year: '2023'
                },
                { 
                    id: 4, 
                    title: 'Kanso: Minimal Data', 
                    venue: 'Museum of Contemporary Digital Art', 
                    year: '2022'
                },
                { 
                    id: 5, 
                    title: 'Shibui: Restrained Motion', 
                    venue: 'Gallery Space, New York', 
                    year: '2022'
                },
                { 
                    id: 6, 
                    title: 'Digital Ink Flow', 
                    venue: 'International Media Art Festival', 
                    year: '2021'
                }
            ];
            
            const sectionRef = React.useRef(null);
            const isVisible = useIntersectionObserver(sectionRef, { threshold: 0.1 });

            return (
                <section id="art" ref={sectionRef} className="page-transition py-20 px-6 md:py-32 md:px-12 md:mx-4 md:ml-8 lg:px-16 xl:px-16">
                    <div className="container-wide pl-0 w-full">
                        <div className="max-w-full md:max-w-[600px] lg:max-w-[1200px] mx-auto">
                            <div className={`mb-12 md:mb-20 text-center md:text-left scroll-reveal ${isVisible ? 'revealed' : ''}`}>
                                <span className="tag tag-animate text-[10px] md:text-[11px] lg:text-[12px] tracking-[0.2em] font-bold opacity-40">New Media Art</span>
                            </div>

                            {/* Editorial grid layout - mobile first: 1 column, then 2, then 3 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 max-w-full">
                                {artworks.map((artwork, index) => (
                                    <ArtItem 
                                        key={artwork.id}
                                        artwork={artwork}
                                        index={index}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };



        // Main App Component
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                // Handle initial hash
                const hash = window.location.hash.slice(1);
                if (hash) {
                    // Check if hash is a project link (e.g., work/project-1)
                    const projectMatch = hash.match(/work\/project-(\d+)/);
                    if (projectMatch) {
                        const projectId = parseInt(projectMatch[1]);
                        setSelectedProject(projectId);
                        setCurrentPage('work');
                        // Scroll to top when opening project from hash
                        window.scrollTo({ top: 0, behavior: 'instant' });
                    } else {
                        scrollToSection(hash);
                        setCurrentPage(hash);
                    }
                }

                // Handle hash changes
                const handleHashChange = () => {
                    const newHash = window.location.hash.slice(1) || 'home';
                    const projectMatch = newHash.match(/work\/project-(\d+)/);
                    if (projectMatch) {
                        const projectId = parseInt(projectMatch[1]);
                        setSelectedProject(projectId);
                        setCurrentPage('work');
                        // Scroll to top when opening project from hash change
                        window.scrollTo({ top: 0, behavior: 'instant' });
                    } else {
                        setSelectedProject(null);
                        scrollToSection(newHash);
                        setCurrentPage(newHash);
                    }
                };

                // Handle scroll to update active nav (only when not viewing project detail)
                const handleScroll = () => {
                    if (selectedProject) return; // Don't update nav when viewing project detail
                    
                    const sections = ['home', 'work', 'art'];
                    const scrollPosition = window.scrollY + 200;

                    for (let i = sections.length - 1; i >= 0; i--) {
                        const section = document.getElementById(sections[i]);
                        if (section && section.offsetTop <= scrollPosition) {
                            setCurrentPage(sections[i]);
                            window.history.replaceState(null, '', `#${sections[i]}`);
                            break;
                        }
                    }
                };

                window.addEventListener('hashchange', handleHashChange);
                window.addEventListener('scroll', handleScroll, { passive: true });

                return () => {
                    window.removeEventListener('hashchange', handleHashChange);
                    window.removeEventListener('scroll', handleScroll);
                };
            }, [selectedProject]);

            const scrollToSection = (sectionId) => {
                const element = document.getElementById(sectionId);
                if (element) {
                    const offset = 0;
                    const elementPosition = element.offsetTop;
                    const offsetPosition = elementPosition - offset;

                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            };

            const handleNavigate = (page) => {
                setCurrentPage(page);
                setSelectedProject(null);
                window.location.hash = page;
                scrollToSection(page);
            };

            const handleProjectSelect = (projectId) => {
                setSelectedProject(projectId);
                if (projectId) {
                    window.location.hash = `work/project-${projectId}`;
                    setCurrentPage('work');
                    // Scroll to top immediately when showing project detail
                    window.scrollTo({ top: 0, behavior: 'instant' });
                    // Also ensure scroll after a brief delay to handle any layout shifts
                    setTimeout(() => {
                        window.scrollTo({ top: 0, behavior: 'instant' });
                    }, 0);
                } else {
                    window.location.hash = 'work';
                    setCurrentPage('work');
                    // Scroll to work section when going back
                    setTimeout(() => scrollToSection('work'), 100);
                }
            };

            // Define projects array at App level so it can be shared
            const projects = [
                { 
                    id: 1, 
                    title: 'Unified Voice Note Companion', 
                    category: 'UX Design', 
                    year: '2025',
                    quote: 'Reducing task completion time by 80% through intentional information architecture and refined interaction patterns.',
                    image: 'assets/goodSpeak.png',
                    link: '#work/project-1'
                },
                { 
                    id: 2, 
                    title: 'Apple Retail Experience Design', 
                    category: 'Service Design', 
                    year: '2024',
                    quote: 'Identifying customer needs through UX research and designing new service approaches for business clients, contributing to market-leading performance.',
                    image: 'assets/apple.png',
                    link: '#work/project-2'
                },
                { 
                    id: 3, 
                    title: 'Meta Internal Tools', 
                    category: 'Software Engineering', 
                    year: '2020',
                    quote: 'Solving software engineering problems under the guidance of Engineering managers, with focus on technical mentorship and growth.',
                    image: 'assets/meta.png',
                    link: '#work/project-3'
                },
                { 
                    id: 4, 
                    title: 'KnackApp Mobile UX Redesign', 
                    category: 'UX Design', 
                    year: '2019',
                    quote: "Leading the UX design for a multi-award-winning game, driving a 67% increase in user base, and redesigning the platform's app ecosystem.",
                    image: 'assets/knack.png',
                    link: '#work/project-4'
                }
            ];

            return (
                <div className="min-h-screen bg-rice-paper">
                    <Navigation currentPage={currentPage} onNavigate={handleNavigate} />
                    {/* Left Navigation - Mirror of right nav */}
                    <nav className="fixed left-0 top-0 bottom-0 z-50 w-[120px] py-16 ml-4 md:ml-0 slide-in-left">
                        <div className="flex flex-col h-full justify-between">
                            <div className={`flex flex-col items-start md:items-center ${currentPage !== 'home' ? 'hidden md:flex' : ''}`}>
                                <div className="[writing-mode:vertical-rl] [text-orientation:mixed] rotate-180 fade-in-delay-1">
                                    <div className="text-ink-black text-body-s font-light tracking-[0.2em] opacity-40">
                                        {currentPage === 'home' ? 'Portfolio' : currentPage === 'work' ? 'Work Experience' : currentPage === 'art' ? 'New Media Interactive Art' : 'Portfolio'}
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col items-start md:items-center">
                                {/* Empty space for nav items if needed */}
                            </div>
                            <div className={`flex flex-col items-start md:items-center gap-0 ${currentPage !== 'home' ? 'hidden md:flex' : ''}`}>
                                <div className="flex flex-col items-start md:items-center gap-1 mb-2 fade-in-delay-3">
                                    {[...Array(8)].map((_, i) => {
                                        const reversedIndex = 7 - i;
                                        const opacity = Math.max(0.2, 1 - (reversedIndex * 0.12));
                                        const isDot = reversedIndex >= 4;
                                        return (
                                            <div
                                                key={i}
                                                className="w-px bg-[var(--fog-grey)]"
                                                style={{
                                                    height: isDot ? '2px' : '8px',
                                                    opacity: opacity,
                                                    borderRadius: isDot ? '50%' : '0'
                                                }}
                                            />
                                        );
                                    })}
                                </div>
                                <div className="w-px h-16 bg-[var(--fog-grey)] mr-auto md:mx-auto"></div>
                            </div>
                        </div>
                    </nav>
                    <main>
                        {selectedProject ? (
                            <ProjectDetail 
                                project={projects.find(p => p.id === selectedProject)} 
                                onBack={() => handleProjectSelect(null)} 
                            />
                        ) : (
                            <>
                                <Home />
                                <Work selectedProject={selectedProject} onProjectSelect={handleProjectSelect} projects={projects} />
                                <Art />
                            </>
                        )}
                    </main>
                </div>
            );
        };

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

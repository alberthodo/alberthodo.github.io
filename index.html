    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    
    <style>
        :root {
            --ink-black: #0E0E0E;
            --rice-paper: #FAF8F5;
            --fog-grey: #D9D6D2;
            --shu-red: #E34234;
            --aizome-blue: #26406F;
            --deep-cedar: #1E3A2E;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="%234A4A4A" stroke-width="1.5" opacity="0.6"/></svg>') 12 12, auto;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--rice-paper);
            color: var(--ink-black);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 300;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="%234A4A4A" stroke-width="1.5" opacity="0.6"/></svg>') 12 12, auto;
        }
        
        * {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="%234A4A4A" stroke-width="1.5" opacity="0.6"/></svg>') 12 12, auto !important;
        }
        
        a, button, .nav-link, .work-project, .hover-lift, input, textarea, select {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="%234A4A4A" stroke-width="1.5" opacity="0.6"/></svg>') 12 12, pointer !important;
        }
        
        h1 {
            font-weight: 200 !important;
        }
        
        .font-serif {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-style: italic;
        }
        
        /* Typography Scale - Following brand guidelines */
        .text-h1 { 
            font-size: 72px; 
            font-weight: 300; 
            line-height: 1.1; 
            letter-spacing: -0.02em;
        }
        .text-h2 { 
            font-size: 48px; 
            font-weight: 300; 
            line-height: 1.2; 
            letter-spacing: -0.01em;
        }
        .text-h3 { 
            font-size: 32px; 
            font-weight: 400; 
            line-height: 1.3; 
            letter-spacing: -0.01em;
        }
        .text-body-l { 
            font-size: 20px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        .text-body-m { 
            font-size: 18px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        .text-body-s { 
            font-size: 16px; 
            font-weight: 400; 
            line-height: 1.6; 
        }
        
        /* Responsive typography scale - using Tailwind breakpoints */
        @media (max-width: 768px) {
            .text-h1 { font-size: 48px; }
            .text-h2 { font-size: 36px; }
            .text-h3 { font-size: 28px; }
            .text-body-l { font-size: 18px; }
        }
        
        /* Color System */
        .text-ink-black { color: var(--ink-black); }
        .bg-ink-black { background-color: var(--ink-black); }
        .text-rice-paper { color: var(--rice-paper); }
        .bg-rice-paper { background-color: var(--rice-paper); }
        .text-fog-grey { color: var(--fog-grey); }
        .bg-fog-grey { background-color: var(--fog-grey); }
        .text-shu-red { color: var(--shu-red); }
        .bg-shu-red { background-color: var(--shu-red); }
        
        /* Container with wide margins - more editorial - mobile first */
        .container-wide {
            max-width: 2200px;
            margin: 0 auto;
            padding: 0 1rem; /* Mobile: 16px */
        }
        
        @media (min-width: 768px) {
            .container-wide {
                padding: 0 2rem; /* Tablet: 32px */
            }
        }
        
        @media (min-width: 1024px) {
            .container-wide {
                padding: 0 60px;
            }
        }
        
        @media (min-width: 1440px) {
            .container-wide {
                padding: 0 70px;
            }
        }
        
        @media (min-width: 1920px) {
            .container-wide {
                padding: 0 80px;
            }
        }
        
        /* Navigation */
        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--ink-black);
            letter-spacing: 0.03em;
            font-size: 14px;
            font-weight: 300;
            transition: opacity 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }
        
        .nav-link:hover {
            opacity: 0.6;
            transform: translateX(-2px);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--ink-black);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .nav-link.active {
            opacity: 1;
            color: var(--aizome-blue);
            font-weight: 500;
            transition: opacity 0.3s ease, color 0.3s ease;
        }
        
        .nav-link.active::after {
            display: none;
        }
        
        .nav-link.active::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 4px;
            height: 4px;
            background-color: var(--aizome-blue);
            border: 1px solid var(--aizome-blue);
            border-radius: 50%;
            box-shadow: 0 0 0 0.5px var(--aizome-blue);
            animation: activeDotIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes activeDotIn {
            to {
                transform: translateY(-50%) scale(1);
            }
        }
        
        /* Image Placeholder */
        .image-placeholder {
            background-color: var(--fog-grey);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-black);
            opacity: 0.2;
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 300;
        }
        
        /* Tag/Label */
        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--aizome-blue);
        }
        
        /* Work Project Title - Ensure line-height is applied */
        .work-project-title {
            line-height: 1.0 !important;
        }
        
        /* Hover Effects - Tactile */
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-3px);
            opacity: 0.95;
        }
        
        /* Smooth Page Section Transitions */
        section {
            transition: opacity 0.3s ease-out;
        }
        
        /* Enhanced Image Transitions */
        .work-project-image img,
        .work-project-image .image-placeholder {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Work Project Clickable Styles */
        .work-project a {
            text-decoration: none;
            color: inherit;
        }
        
        .work-project {
            transition: background-color 0.3s ease;
        }
        
        .work-project-container {
            padding: 16px 0 0 0;
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }
        
        .work-project-content {
            padding: 0 36px;
        }
        
        .work-project:hover .work-project-container {
            background-color: rgba(0, 0, 0, 0.015);
            border-radius: 12px;
        }
        
        .work-project:hover .work-project-image img,
        .work-project:hover .work-project-image .image-placeholder {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }
        
        .work-project-lock-overlay {
            pointer-events: none;
        }
        
        .work-project:hover .work-project-lock-overlay {
            opacity: 1;
        }
        
        /* Page Load Animation */
        body {
            opacity: 0;
            animation: pageFadeIn 0.6s ease-out forwards;
        }
        
        @keyframes pageFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Page Transitions */
        .page-transition {
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        /* Staggered Fade In */
        .fade-in {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        .fade-in-delay-1 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.1s forwards;
        }
        
        .fade-in-delay-2 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }
        
        .fade-in-delay-3 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }
        
        .fade-in-delay-4 {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Slide In from Right */
        .slide-in-right {
            opacity: 0;
            transform: translateX(30px);
            animation: slideInRight 0.8s ease-out forwards;
        }
        
        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Slide In from Left */
        .slide-in-left {
            opacity: 0;
            transform: translateX(-30px);
            animation: slideInLeft 0.8s ease-out forwards;
        }
        
        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Scale In */
        .scale-in {
            opacity: 0;
            transform: scale(0.95);
            animation: scaleIn 0.6s ease-out forwards;
        }
        
        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Scroll Reveal - Initially Hidden */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Navigation Animation */
        .nav-animate {
            opacity: 0;
            animation: fadeInRight 1s ease-out 0.3s forwards;
        }
        
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Mobile Menu Styles */
        .mobile-menu-button {
            display: none;
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            width: 44px;
            height: 44px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        
        @media (max-width: 768px) {
            .mobile-menu-button {
                display: flex;
            }
        }
        
        .mobile-menu-button span {
            display: block;
            width: 24px;
            height: 1.5px;
            background-color: var(--ink-black);
            transition: all 0.3s ease;
            transform-origin: center;
        }
        
        .mobile-menu-button.open span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        
        .mobile-menu-button.open span:nth-child(2) {
            opacity: 0;
        }
        
        .mobile-menu-button.open span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }
        
        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--rice-paper);
            z-index: 99;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .mobile-menu-overlay.open {
            display: flex;
            opacity: 1;
        }
        
        .mobile-menu-overlay .mobile-nav-link {
            font-size: 24px;
            font-weight: 300;
            color: var(--ink-black);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: opacity 0.3s ease, color 0.3s ease;
            position: relative;
        }
        
        .mobile-menu-overlay .mobile-nav-link:hover,
        .mobile-menu-overlay .mobile-nav-link:active {
            opacity: 0.6;
        }
        
        .mobile-menu-overlay .mobile-nav-link.active {
            color: var(--aizome-blue);
            font-weight: 500;
        }
        
        .mobile-menu-overlay .mobile-nav-link.active::after {
            content: '';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background-color: var(--aizome-blue);
            border-radius: 50%;
        }
        
        @media (min-width: 769px) {
            .mobile-menu-overlay {
                display: none !important;
            }
        }
        
        /* Prevent body scroll when mobile menu is open */
        body.mobile-menu-open {
            overflow: hidden;
        }
        
        /* Mobile-specific improvements */
        @media (max-width: 768px) {
            /* Better spacing for mobile sections */
            section {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            
            /* Ensure content doesn't get cut off by fixed elements */
            main {
                padding-top: 1rem;
            }
            
            /* Better touch targets */
            a, button {
                min-height: 44px;
                min-width: 44px;
            }
        }
        
        /* Hero Title Animation */
        .hero-title {
            opacity: 0;
            animation: heroTitleIn 1.2s ease-out 0.2s forwards;
        }
        
        @keyframes heroTitleIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Hero Subtitle Animation */
        .hero-subtitle {
            opacity: 0;
            animation: heroSubtitleIn 1s ease-out 0.6s forwards;
        }
        
        @keyframes heroSubtitleIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.7;
            }
        }
        
        /* Work Project Stagger */
        .work-item {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .work-item.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Art Grid Item Animation */
        .art-item {
            opacity: 0;
            transform: scale(0.98) translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .art-item.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        
        /* Smooth Image Load */
        img {
            opacity: 0;
            transition: opacity 0.6s ease-out;
            background-color: var(--fog-grey);
        }
        
        img.loaded {
            opacity: 1;
            background-color: transparent;
        }
        
        /* SVG images should not have background */
        img[src$=".svg"],
        img[src*=".svg"] {
            background-color: transparent !important;
        }
        
        /* Lock icon specific styling */
        .work-project-lock-overlay img {
            background-color: transparent !important;
            opacity: 0.6 !important;
        }
        
        /* Subtle Loading Pulse */
        @keyframes subtlePulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        img:not(.loaded) {
            animation: subtlePulse 1.5s ease-in-out infinite;
        }
        
        /* Prevent Flash of Unstyled Content */
        .preload {
            visibility: hidden;
        }
        
        .preload.loaded {
            visibility: visible;
        }
        
        /* Password Modal */
        .password-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(14, 14, 14, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.4s ease-out;
        }
        
        .password-modal {
            background-color: var(--rice-paper);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            animation: fadeInUp 0.5s ease-out;
        }
        
        /* Modal button - use grey instead of black */
        .password-modal .btn-primary {
            background-color: var(--fog-grey);
            color: var(--ink-black);
        }
        
        .password-modal .btn-primary:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }
        
        .password-input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--fog-grey);
            background: transparent;
            font-size: 18px;
            font-weight: 300;
            color: var(--ink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: border-color 0.2s ease;
            margin-bottom: 8px;
        }
        
        .password-input:focus {
            outline: none;
            border-bottom-color: var(--ink-black);
        }
        
        .password-input::placeholder {
            color: var(--ink-black);
            opacity: 0.3;
        }
        
        .password-error {
            color: var(--ink-black);
            font-size: 14px;
            margin-top: 12px;
            opacity: 0;
            animation: passwordErrorIn 0.3s ease-out forwards;
            font-weight: 300;
        }
        
        @keyframes passwordErrorIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.5;
            }
        }
        
        /* Button Hover Enhancement */
        .btn-primary {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        
        /* Tag Animation */
        .tag-animate {
            opacity: 0;
            animation: tagFadeIn 0.8s ease-out forwards;
        }
        
        @keyframes tagFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 0.4;
                transform: translateY(0);
            }
        }
        
        /* Back Button Animation */
        button {
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        
        button:hover {
            transform: translateX(-3px);
        }
        
        /* Smooth Scroll Behavior Enhancement */
        html {
            scroll-behavior: smooth;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Divider */
        .divider {
            height: 1px;
            background-color: var(--fog-grey);
        }
        
        /* Button */
        .btn-primary {
            background-color: var(--ink-black);
            color: var(--rice-paper);
            padding: 14px 28px;
            border-radius: 4px;
            border: none;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            transition: opacity 0.2s ease;
            min-height: 44px;
            letter-spacing: 0.02em;

                                {[...Array(8)].map((_, i) => {
                                    const reversedIndex = 7 - i;
                                    const opacity = Math.max(0.2, 1 - (reversedIndex * 0.12));
                                    const isDot = reversedIndex >= 4;

                                        <div

        // Home/Landing Page - More editorial, less centered
        const Home = () => {
            const titleRef = React.useRef(null);
            const [subtitleWidth, setSubtitleWidth] = React.useState(null);
            const [letterSpacing, setLetterSpacing] = React.useState(0.65);

            React.useEffect(() => {
                if (titleRef.current) {
                    const titleWidth = titleRef.current.offsetWidth;
                    setSubtitleWidth(titleWidth);
                    
                    // Calculate letter spacing to match width
                    const subtitle = 'INTERACTION DESIGNER & NEW MEDIA ARTIST';
                    const baseWidth = subtitle.length * 8.4; // approximate character width at 14px
                    const spacingNeeded = (titleWidth - baseWidth) / (subtitle.length - 1);
                    const calculatedSpacing = Math.max(0, spacingNeeded / 14); // convert to em
                    setLetterSpacing(calculatedSpacing);
                }
            }, []);

            return (
                <section id="home" className="min-h-screen page-transition hero-section py-20 px-6 md:py-32 md:px-12 md:mx-4 md:ml-8 lg:px-16 flex flex-col justify-center items-center md:items-start">

                                    Hodo's Design

                                <h1 className="hero-title font-light text-4xl md:text-7xl lg:text-[100px] xl:text-[128px] leading-[1.05] tracking-[0.02em] mb-4 md:mb-6 font-[200] text-[#4A4A4A]" style={{ animationDelay: '0.3s' }}>

                    </div>

            );

        // Password Modal Component
        const PasswordModal = ({ isOpen, onClose, onSuccess, showError, onError }) => {
            const [password, setPassword] = useState('');
            const inputRef = React.useRef(null);
            
            useEffect(() => {
                if (isOpen && inputRef.current) {
                    inputRef.current.focus();
                    setPassword('');
                }
            }, [isOpen]);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                // Obfuscated password check to prevent plain text exposure
                const check = (pwd) => {
                    if (pwd.length !== 12) return false;
                    const expected = [33, 72, 111, 100, 111, 68, 101, 115, 105, 103, 110];
                    const actual = pwd.split('').map(c => c.charCodeAt(0));
                    return expected.every((val, idx) => actual[idx] === val);
                };
                if (check(password)) {
                    onSuccess();
                    setPassword('');
                } else {
                    if (onError) {
                        onError(true);
                    }
                    setPassword('');
                    if (inputRef.current) {
                        inputRef.current.focus();
                    }
                }
            };
            
            const handleKeyDown = (e) => {
                if (e.key === 'Escape') {
                    onClose();
                }
            };
            
            if (!isOpen) return null;
            
            return (
                <div className="password-modal-overlay" onClick={onClose} onKeyDown={handleKeyDown}>
                    <div className="password-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="mb-8 md:mb-12">
                            <span className="tag text-[10px] md:text-[11px] tracking-[0.2em] font-bold opacity-40 mb-4 block">

                                Enter Password
                            </h3>
                            <p className="text-sm md:text-base text-[#4A4A4A] opacity-60 font-[300] leading-[1.6]">
                                This project is password protected. Please enter the password to continue.
                            </p>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <input
                                ref={inputRef}
                                type="password"
                                className="password-input form-input"
                                placeholder="Password"
                                value={password}
                                onChange={(e) => {
                                    setPassword(e.target.value);
                                    if (showError && onError) {
                                        onError(false); // Clear error when user starts typing
                                    }
                                }}
                                autoFocus
                            />
                            {showError && (
                                <div className="password-error">

                                </div>

                            <div className="flex flex-col sm:flex-row gap-4 mt-12">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="text-sm md:text-base text-[#4A4A4A] opacity-60 hover:opacity-100 transition-opacity font-[300] px-0 py-2 text-left"
                                >
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    className="btn-primary sm:ml-auto"
                                >
                                    Unlock
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // Intersection Observer Hook for Scroll Animations
        const useIntersectionObserver = (ref, options = {}) => {
            const [isIntersecting, setIsIntersecting] = useState(false);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsIntersecting(true);
                    }
                }, {
                    threshold: 0.1,
                    rootMargin: '0px 0px -50px 0px',
                    ...options
                });
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => {
                    if (ref.current) {
                        observer.unobserve(ref.current);
                    }
                };
            }, [ref]);
            
            return isIntersecting;
        };

                        </div>

                        {/* TLDR */}
                        {content.tldr && (

                                <h2 className="font-light text-2xl md:text-3xl lg:text-[36px] leading-[1.2] tracking-[0.01em] font-[200] text-[#4A4A4A] mb-4 text-center md:text-left">
                                    TL;DR
                                </h2>

                                    <p>{content.tldr}</p>
                                </div>
                                {/* Cards */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mt-6 md:mt-8">
                                    {/* Situation Card */}

                                        <div className="flex items-center justify-center md:justify-start gap-3 mb-4">

                                )}
                                {/* Sticky Notes */}
                                <div className="flex flex-wrap gap-3 md:gap-6 mb-6 md:mb-8">
                                    {[
                                        'Editing happens in waves: quick corrections first, then deeper edits, requiring different editing modes.',
                                        'Users think in workflows, not features: "I need to turn this into an email" not "I need format X".',

                                </div>

                                            <>

                                    <div className="space-y-8 md:space-y-12">

                                                    },

                            </div>
                        </div>
                    </nav>
                    <main>
                        {selectedProject ? (
                            <ProjectDetail 
                                project={projects.find(p => p.id === selectedProject)} 
                                onBack={() => handleProjectSelect(null)} 
                            />
                        ) : (
                            <>
                                <Home />
                                <Art />
                                <Work selectedProject={selectedProject} onProjectSelect={handleProjectSelect} projects={projects} />
                            </>
                        )}
                    </main>
                    <footer className="container-wide py-12 md:py-16">
                        <div className="text-center text-[#4A4A4A] opacity-60 font-[300] text-xs">
                            © 2025 Albert Hodo
                        </div>
                        <div className="text-center text-[#4A4A4A] opacity-50 font-[300] text-xs mt-4">
                            Designed and built with HTML 📄, Tailwind CSS 🎨, React.js ⚛️, and coffee ☕
                        </div>
                    </footer>
                </div>
            );
        };

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
